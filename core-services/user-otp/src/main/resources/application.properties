spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.bootstrap.servers=localhost:9092

server.port=8090
server.servlet.context-path=/user-otp

otp.host=http://localhost:8089/otp
otp.create.url=/v1/_create
user.host=http://localhost:8081/
search.user.url=/user/_search

sms.topic=egov.core.notification.sms.otp
email.topic=org.egov.core.notification.email
expiry.time.for.otp=120000

egov.localisation.host=http://egov-localization:8080
egov.localisation.search.endpoint=/localization/messages/v1/_search
egov.localisation.tenantid.strip.suffix.count=1

# ==========================================
# SMS Message Formats (Loosely Coupled)
# ==========================================
sms.message.format.login=Dear User,\n\nYour OTP for login to Delhi Jal Board portal is %s. OTP is valid for 10 minutes. Do not share this OTP with anyone.\n\nDelhi Jal Board
sms.message.format.ekyc=Dear Consumer,\nYour confirmation number for DJB eKYC is %s.\nPlease share this number only with the authorized DJB eKYC representative to complete the process.\nThank you,\nDelhi Jal Board\n\n\u092a\u094d\u0930\u093f\u092f \u0909\u092a\u092d\u094b\u0915\u094d\u0924\u093e,\nDJB eKYC \u0915\u0947 \u0932\u093f\u090f \u0906\u092a\u0915\u093e \u092a\u0941\u0937\u094d\u091f\u093f \u0928\u0902\u092c\u0930 %s  \u0939\u0948\u0964\n\u0915\u0943\u092a\u092f\u093e eKYC \u092a\u094d\u0930\u0915\u094d\u0930\u093f\u092f\u093e \u092a\u0942\u0930\u0940 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u092f\u0939 \u0928\u0902\u092c\u0930 \u0915\u0947\u0935\u0932 \u0926\u093f\u0932\u094d\u0932\u0940 \u091c\u0932 \u092c\u094b\u0930\u094d\u0921 (DJB) \u0915\u0947 \u0905\u0927\u093f\u0915\u0943\u0924 eKYC \u092a\u094d\u0930\u0924\u093f\u0928\u093f\u0927\u093f \u0915\u0947 \u0938\u093e\u0925 \u0939\u0940 \u0938\u093e\u091d\u093e \u0915\u0930\u0947\u0902\u0964\n\u0927\u0928\u094d\u092f\u0935\u093e\u0926,\n\u0926\u093f\u0932\u094d\u0932\u0940 \u091c\u0932 \u092c\u094b\u0930\u094d\u0921 (DJB)
sms.use.dlt.approved.format=true


