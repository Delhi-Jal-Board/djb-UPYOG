# tanker Scheduler properties
wt.fixedpoint.scheduler.enabled=true
wt.fixedpoint.scheduler.cron=0 40 18 * * *
#wt.fixedpoint.scheduler.cron=0 10 22 * * *

wt.fixedpoint.tenant-id=dl.djb
#wt.fixed.point.scheduler.timezone=Asia/Kolkata
wt.fixed.point.scheduler.timezone=UTC
wt.booking.default-water-quantity=3000
wt.booking.extra-charge=N
# Vehicle assignment rule
wt.vehicle.preferred-trip-limit=6
wt.vehicle.max-trip-limit=8
wt.vehicle.trip-duration-minutes=150

# Enable or disable the auto-cancel scheduler
wt.cancel.scheduler.enabled=true

# CRON expression: Seconds Minutes Hours DayOfMonth Month DayOfWeek
# Runs at 23:30:00 (11:30 PM) every day
wt.cancel.scheduler.cron=0 0 18 * * *
#wt.cancel.scheduler.cron=0 30 23 * * ?